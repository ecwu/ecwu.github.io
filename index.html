<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex, follow">
    <meta
      name="description"
      content="page.ecwuuuuu.com hosts GitHub Pages for projects maintained by Zhenghao Wu (ECWU)."
    >
    <link rel="canonical" href="https://ecwuuuuu.com/">
    <title>ECWU Project Pages</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f4f1ea;
        --foreground: #191919;
        --muted: #625f58;
        --line: #cbc5b9;
        --accent: #174f3f;
        --accent-foreground: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #171816;
          --foreground: #f1eee7;
          --muted: #b9b4aa;
          --line: #45463f;
          --accent: #9ed4bd;
          --accent-foreground: #11251d;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--background);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--foreground);
        background: var(--background);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(100% - 2.5rem, 46rem);
        min-height: 100vh;
        margin-inline: auto;
        padding-block: clamp(4rem, 14vh, 9rem) 3rem;
        display: flex;
        flex-direction: column;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-family: Iowan Old Style, Baskerville, "Times New Roman", serif;
        font-size: clamp(3.25rem, 10vw, 6rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 0.95;
        text-wrap: balance;
      }

      .summary {
        max-width: 38rem;
        margin: 2rem 0 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      }

      .summary strong {
        color: var(--foreground);
        font-weight: 650;
      }

      .actions {
        margin-top: 2.25rem;
      }

      .primary-link {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1.1rem;
        border-radius: 0.75rem;
        color: var(--accent-foreground);
        background: var(--accent);
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease-out, box-shadow 160ms ease-out;
      }

      .primary-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 16%);
      }

      .primary-link:focus-visible {
        outline: 3px solid var(--foreground);
        outline-offset: 4px;
      }

      footer {
        margin-top: auto;
        padding-top: 4rem;
        color: var(--muted);
        font-size: 0.875rem;
      }

      footer::before {
        content: "";
        display: block;
        width: 3rem;
        margin-bottom: 1rem;
        border-top: 1px solid var(--line);
      }

      .host {
        color: var(--foreground);
        font-weight: 700;
      }

      ::selection {
        color: var(--accent-foreground);
        background: var(--accent);
      }

      @media (prefers-reduced-motion: reduce) {
        .primary-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Project pages live here.</h1>
      <p class="summary">
        This subdomain hosts GitHub Pages for projects maintained by
        <strong>Zhenghao Wu (ECWU)</strong>, owner of
        <strong>ecwuuuuu.com</strong>. The main website and blog are available
        at the address below.
      </p>
      <p class="actions">
        <a class="primary-link" href="https://ecwuuuuu.com/">Visit the main website</a>
      </p>
      <footer>
        <span class="host">page.ecwuuuuu.com</span><br>
        Individual projects are available under their repository paths.
      </footer>
    </main>
  </body>
</html>
